<div class="app-container">
  <mat-toolbar color="primary" class="app-toolbar">
    <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="app-title">AM Agencies</span>
    <span class="toolbar-spacer"></span>
    <span class="app-subtitle">Supply Chain Management</span>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" opened class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>

        <a mat-list-item routerLink="/shops" routerLinkActive="active-link">
          <mat-icon matListItemIcon>store</mat-icon>
          <span matListItemTitle>Shops</span>
        </a>

        <a mat-list-item routerLink="/products" routerLinkActive="active-link">
          <mat-icon matListItemIcon>inventory_2</mat-icon>
          <span matListItemTitle>Products</span>
        </a>

        <a mat-list-item routerLink="/catalog" routerLinkActive="active-link">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Shop Catalog</span>
        </a>

        <a mat-list-item routerLink="/order-builder" routerLinkActive="active-link">
          <mat-icon matListItemIcon>shopping_cart</mat-icon>
          <span matListItemTitle>Order Builder</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
